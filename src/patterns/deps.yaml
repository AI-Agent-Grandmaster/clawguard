# ClawGuard Dependency Patterns
# Known malicious packages and popular packages for typosquat detection

# Known malicious npm packages
# Sources: npm security advisories, Snyk, various security reports
malicious_npm:
  # Event-stream supply chain attack (2018)
  - name: event-stream
    versions: ["3.3.6"]
    reason: "Supply chain attack - contained flatmap-stream malware"
    
  - name: flatmap-stream
    versions: ["*"]
    reason: "Malware targeting Bitcoin wallets"
    
  # ua-parser-js compromise (2021)
  - name: ua-parser-js
    versions: ["0.7.29", "0.8.0", "1.0.0"]
    reason: "Compromised versions contained cryptominer and password stealer"
    
  # coa and rc compromise (2021)
  - name: coa
    versions: ["2.0.3", "2.0.4", "2.1.1", "2.1.3", "3.0.1", "3.1.3"]
    reason: "Compromised versions contained malware"
    
  - name: rc
    versions: ["1.2.9", "1.3.9", "2.3.9"]
    reason: "Compromised versions contained malware"
    
  # Typosquat attacks
  - name: crossenv
    versions: ["*"]
    reason: "Typosquat of cross-env, stole environment variables"
    
  - name: cross-env.js
    versions: ["*"]
    reason: "Typosquat of cross-env"
    
  - name: d3.js
    versions: ["*"]
    reason: "Typosquat of d3"
    
  - name: fabric-js
    versions: ["*"]
    reason: "Typosquat of fabric"
    
  - name: ffmepg
    versions: ["*"]
    reason: "Typosquat of ffmpeg"
    
  - name: gruntcli
    versions: ["*"]
    reason: "Typosquat of grunt-cli"
    
  - name: http-proxy.js
    versions: ["*"]
    reason: "Typosquat of http-proxy"
    
  - name: jquery.js
    versions: ["*"]
    reason: "Typosquat of jquery"
    
  - name: mariadb
    versions: ["*"]
    reason: "Typosquat of mysql/mariadb packages"
    
  - name: mongose
    versions: ["*"]
    reason: "Typosquat of mongoose"
    
  - name: mssql.js
    versions: ["*"]
    reason: "Typosquat of mssql"
    
  - name: mssql-node
    versions: ["*"]
    reason: "Typosquat of mssql"
    
  - name: mysqljs
    versions: ["*"]
    reason: "Typosquat of mysql"
    
  - name: node-hierarchical
    versions: ["*"]
    reason: "Contained malicious code"
    
  - name: node-tkinter
    versions: ["*"]
    reason: "Typosquat, exfiltrated data"
    
  - name: nodefabric
    versions: ["*"]
    reason: "Typosquat of node-fabric"
    
  - name: opencv.js
    versions: ["*"]
    reason: "Typosquat of opencv"
    
  - name: openssl.js
    versions: ["*"]
    reason: "Typosquat of node openssl bindings"
    
  - name: proxy.js
    versions: ["*"]
    reason: "Typosquat"
    
  - name: shadowsock
    versions: ["*"]
    reason: "Typosquat of shadowsocks"
    
  - name: smb
    versions: ["*"]
    reason: "Contained malware"
    
  - name: socket.io
    versions: ["*"]
    reason: "Note: check source - there have been typosquats"
    
  - name: socks
    versions: ["*"]
    reason: "Contained malware"
    
  - name: sqliter
    versions: ["*"]
    reason: "Typosquat of sqlite3"
    
  - name: sqlite.js
    versions: ["*"]
    reason: "Typosquat of sqlite3"
    
  - name: sqlserver
    versions: ["*"]
    reason: "Typosquat"
    
  - name: tkinter
    versions: ["*"]
    reason: "Typosquat"

  # 2022-2023 malicious packages
  - name: colors
    versions: ["1.4.1", "1.4.2"]
    reason: "Protestware - intentionally corrupted output"
    
  - name: faker
    versions: ["6.6.6"]
    reason: "Protestware - broke functionality"
    
  - name: node-ipc
    versions: ["10.1.1", "10.1.2", "10.1.3"]
    reason: "Protestware - destructive payload targeting Russia/Belarus"
    
  - name: peacenotwar
    versions: ["*"]
    reason: "Dependency of malicious node-ipc versions"

